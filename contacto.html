<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacto — FashionLux</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{margin:0;font-family:Inter,Arial;background:#f4f7fb;color:#0b1b2b;}
header{background:#000;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;}
.logo{width:46px;height:46px;border-radius:8px;background:linear-gradient(135deg,#ff4f70,#ff7b9a);display:flex;align-items:center;justify-content:center;font-weight:700;}

nav a{color:white;margin-left:18px;text-decoration:none;font-weight:600;}
.menu-toggle{display:none;font-size:24px;color:white;background:none;border:none;cursor:pointer;}

@media(max-width:768px){
    nav{display:none;position:absolute;right:0;top:64px;background:black;width:200px;flex-direction:column;padding:10px 0;}
    nav a{margin:10px 16px;}
    nav.show{display:flex;}
    .menu-toggle{display:block;}
}

.banner{
    width:100%;
    height:320px;
    background:url('https://images.unsplash.com/photo-1523381294911-8d3cead13475?auto=format&fit=crop&w=1200&q=60') center/cover no-repeat;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}
.banner::after{
    content:'';
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.55);
}
.banner-text{
    position:relative;
    color:#fff;
    text-align:center;
    font-size:32px;
    font-weight:700;
    z-index:2;
    animation:fadeDown 1s ease;
}
@keyframes fadeDown{
    from{opacity:0;transform:translateY(-20px);}
    to{opacity:1;transform:translateY(0);}
}

.container{max-width:900px;margin:40px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,0.05);}
h2{color:#ff4f70;margin-bottom:10px;}
p{color:#555;}
form{display:flex;flex-direction:column;gap:14px;margin-top:18px;}
input,textarea{padding:12px;border:1px solid #ccc;border-radius:8px;font-size:15px;}
button{padding:12px;background:#ff4f70;border:none;color:white;font-weight:700;border-radius:8px;cursor:pointer;}

footer{background:#111;color:white;text-align:center;padding:40px 20px;margin-top:40px;}
.socials{display:flex;justify-content:center;gap:18px;margin-bottom:20px;}
.socials a{
    color:white;
    font-size:24px;
    text-decoration:none;
    transition:0.3s;
}

.socials a:hover{
    transform:scale(1.25);
    color:#ff4f70;
}
.socials a:active{
    transform:scale(0.85);
}
</style>
</head>

<body>

<header>
    <a href="index.html" class="brand">
        <div class="logo">FL</div>
        <div>
            <h1 style="font-size:20px;margin:0;">FashionLux</h1>
            <small style="color:rgba(255,255,255,.6)">seu look, sua identidade</small>
        </div>
    </a>

    <button class="menu-toggle" onclick="toggleMenu()"><i class="fa fa-bars"></i></button>
    <nav id="navMenu">
        <a href="index.html">Início</a>
        <a href="sobre.html">Sobre Nós</a>
        <a href="contacto.html">Contacto</a>
    </nav>
</header>

<div class="banner">
    <div class="banner-text">Contacte-nos</div>
</div>

<div class="container">
    <h2>Entre em contacto connosco</h2>
    <p>Tem dúvidas, sugestões ou precisa de ajuda com a sua encomenda? Envie-nos uma mensagem — responderemos o mais rápido possível.</p>

    <form action="processa_contacto.php" method="POST">
        <input type="text" name="nome" placeholder="Seu nome" required>
        <input type="email" name="email" placeholder="Seu e-mail" required>
        <input type="text" name="assunto" placeholder="Assunto" required>
        <textarea name="mensagem" placeholder="Escreva sua mensagem..." rows="6" required></textarea>
        <button type="submit">Enviar Mensagem</button>
    </form>
</div>

<footer>
    <div class="socials">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-youtube"></i></a>
        <a href="#"><i class="fab fa-whatsapp"></i></a>
    </div>
    <p>&copy; <span id="year"></span> FashionLux. Todos os direitos reservados.</p>
</footer>

<script>
document.getElementById("year").textContent = new Date().getFullYear();
function toggleMenu(){
    document.getElementById("navMenu").classList.toggle("show");
}
</script>

</body>
</html>
